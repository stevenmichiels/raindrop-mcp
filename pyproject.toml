[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raindrop-mcp-server"
version = "0.1.0"
description = "A local stdio MCP server for the Raindrop.io REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Steven Michiels" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "raindrop",
    "raindrop.io",
    "bookmarks",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2.1,<3",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
raindrop-mcp = "raindrop_mcp.server:main"

[project.urls]
Homepage = "https://github.com/stevenmichiels/raindrop-mcp"
Repository = "https://github.com/stevenmichiels/raindrop-mcp"
Issues = "https://github.com/stevenmichiels/raindrop-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/raindrop_mcp"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
